name: Deploy apps to GitHub Pages

on:
  push:
    branches:
      - claude/bgm-podcast-setup-niybdx
      - claude/youtube4-channel-switching-hprr7k
    paths:
      - 'weather-app/**'
      - 'youtube-dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            weather-app/package-lock.json
            youtube-dashboard/package-lock.json
      - name: Build weather-app
        working-directory: weather-app
        run: |
          npm ci
          npm run build
      - name: Build youtube-dashboard
        working-directory: youtube-dashboard
        run: |
          npm ci
          npm run build
      - name: Combine build output
        run: |
          mkdir -p pages-dist
          cp -r weather-app/dist/. pages-dist/
          mkdir -p pages-dist/youtube
          cp -r youtube-dashboard/dist/. pages-dist/youtube/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
