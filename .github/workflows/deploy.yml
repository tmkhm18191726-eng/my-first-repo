name: Deploy weather-app to GitHub Pages

# weather-app の Pages デプロイは youtube-report.yml に統合しました。
# 同じ Pages サイトに2つのワークフローがデプロイすると、後から走ったほうが
# 相手の成果物を丸ごと上書きしてしまうためです。
# このワークフローは手動実行時のみ動きます（weather-app だけを配信したい場合の退避用）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weather-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: weather-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
