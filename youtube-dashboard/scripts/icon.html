<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; }
      .icon {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #ff4d5e 0%, #c4001d 100%);
        font-family: -apple-system, 'Hiragino Maru Gothic ProN', sans-serif;
      }
      .emoji {
        font-size: 58vw;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="icon"><span class="emoji">📺</span></div>
  </body>
</html>
